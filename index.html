<!DOCTYPE html>
<html>
<head>
  <title>Install My Extension</title>
</head>
<body>
  <h1>Install My Chrome Extension</h1>
  <button onclick="installExtension()">Install Extension</button>

  <script>
    function installExtension() {
      chrome.webstore.install(
        'https://chrome.google.com/webstore/detail/cjpalhdlnbpafiamejdnhcphjbkeiagm',
        function() {
          alert('Installed successfully!');
        },
        function(err) {
          alert('Install failed: ' + err);
        }
      );
    }
  </script>
</body>
</html>
